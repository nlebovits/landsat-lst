# Prose rules for landsat-lst.
#
# Repository-owned rules catch local mechanics and formulaic LLM prose.
# Microsoft supplies the developer-documentation baseline, while Readability
# provides advisory document-level metrics. See docs/PROSE.md.

StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/readability/releases/download/v0.1.1/Readability.zip

[*.{md,mdx}]
BasedOnStyles = Vale, Landsat-Terms, Landsat-Mechanics, Landsat-Voice, Landsat-Docs, Microsoft, Readability

Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)

# Keep Microsoft checks that add distinct editorial value. These checks either
# conflict with local conventions, duplicate a repository-owned rule, or
# produce domain-specific false positives.
Microsoft.Contractions = NO
Microsoft.Dashes = NO
Microsoft.Ellipses = NO
Microsoft.FirstPerson = NO
Microsoft.Avoid = NO
Microsoft.Foreign = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Negative = NO
Microsoft.Percentages = NO
Microsoft.Plurals = NO
Microsoft.Quotes = NO
Microsoft.Semicolon = NO
Microsoft.SentenceLength = NO
Microsoft.Spacing = NO
Microsoft.Terms = NO
Microsoft.Units = NO
Microsoft.Uppercase = NO
Microsoft.Vocab = NO

# Existing ADRs repeat technical terms deliberately. Keep future repetition
# visible through the formulaic-voice audit instead of Vale's generic matcher.
Vale.Repetition = NO

# ARI and Flesch Reading Ease are enough to show a trend. Their targets remain
# suggestions because technical names unavoidably raise prose scores.
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

# Generated context and retained evidence are not handwritten documentation.
[AGENTS.md]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

[docs/evidence/**]
BasedOnStyles =

[results/**]
BasedOnStyles =

[**/{node_modules,.venv,venv,vendor,site-packages,.git}/**]
BasedOnStyles =

[**/{LICENSE,LICENCE,COPYING,NOTICE,CHANGELOG}*]
BasedOnStyles =
