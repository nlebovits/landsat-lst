[project]
name = "landsat-lst"
version = "0.1.0"
description = "Global annual Land Surface Temperature composites from Landsat Collection 2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nissim Lebovits", email = "nlebovits@pm.me" }]
keywords = ["landsat", "land-surface-temperature", "urban-heat", "stac", "cog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    # STAC and data loading
    "pystac-client>=0.8.0",
    "pystac>=1.10.0",
    "odc-stac>=0.3.10",
    # Geospatial
    "rioxarray>=0.17.0",
    "xarray>=2024.1.0",
    "rasterio>=1.3.10",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    # Distributed computing
    "dask[distributed]>=2024.1.0",
    "coiled>=1.0.0",
    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Utilities
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "structlog>=24.1.0",
    "icechunk>=1.1.21",
    "virtualizarr>=2.5.1",
    "rio-cogeo>=7.0.2",
    "odc-geo>=0.5.1",
    "planetary-computer>=1.0.0",
    "virtual-tiff>=0.5.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    # Type checking
    "ty>=0.0.1a0",
    # Linting and formatting
    "ruff>=0.5.0",
    "codespell>=2.3.0",
    # Security
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    # Code quality
    "vulture>=2.14",
    "xenon>=0.9.0",
    "pylint>=3.2.0",
    # Pre-commit
    "prek>=0.1.0",
]

[project.scripts]
landsat-lst = "landsat_lst.cli:main"

[project.urls]
Homepage = "https://github.com/nlebovits/landsat-lst"
Documentation = "https://github.com/nlebovits/landsat-lst#readme"
Repository = "https://github.com/nlebovits/landsat-lst"
Issues = "https://github.com/nlebovits/landsat-lst/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landsat_lst"]

# ============================================================================
# Ruff Configuration
# ============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
]

[tool.ruff.lint.isort]
known-first-party = ["landsat_lst"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # unused function argument (fixtures)
    "ARG002",  # unused method argument (fixtures)
    "PLR2004", # magic values in tests are fine
    "PLC0415", # imports not at top level (intentional in smoke tests)
]
"src/landsat_lst/cli.py" = [
    "PLC0415", # lazy imports for CLI performance
]

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may hit external services)",
    "smoke: Smoke tests (minimal end-to-end validation)",
    "slow: Slow tests (skip with -m 'not slow')",
    "network: Tests requiring network access (nightly only)",
    "benchmark: Performance benchmarks (nightly only)",
    "assumption: Phase 0 assumption validation (hits external APIs)",
    "sweep: Parameter sweep tests for optimization",
    "tile: Full tile integration tests (slow, ~5 min)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["src/landsat_lst"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ============================================================================
# Bandit Configuration (security scanning)
# ============================================================================

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert_used - OK in non-production code
]

# ============================================================================
# Codespell Configuration (spell checking)
# ============================================================================

[tool.codespell]
skip = "*.parquet,*.tif,*.tiff,.git,*.lock,.venv,uv.lock"
ignore-words-list = "crs,nd"

# ============================================================================
# Vulture Configuration (dead code detection)
# ============================================================================

# vulture_whitelist.py can be used for false positives
# Run: vulture src/landsat_lst tests --min-confidence 80
