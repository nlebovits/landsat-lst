# prek configuration - Tier 1 CI
# All hooks BLOCK on failure. No warnings, no skips.
# Install: prek install (requires: uv tool install prek)

fail_fast = true

# =============================================================================
# Built-in hooks (native Rust, no network fetch required)
# =============================================================================
[[repos]]
repo = "builtin"
hooks = [
  # --- Format & whitespace ---
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },

  # --- Syntax validation ---
  { id = "check-yaml" },
  { id = "check-toml" },

  # --- Safety & security ---
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
  {
    id = "check-added-large-files",
    args = ["--maxkb=500"],
    exclude = { glob = ["tests/fixtures/**"] },
  },
]

# =============================================================================
# External tool hooks
# =============================================================================
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.14.1"
hooks = [
  { id = "ruff", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/jendrikseipp/vulture"
rev = "v2.14"
hooks = [
  {
    id = "vulture",
    args = ["src/landsat_lst", "tests", "vulture_whitelist.py", "--min-confidence", "80"],
  },
]

[[repos]]
repo = "https://github.com/rubik/xenon"
rev = "v0.9.3"
hooks = [
  {
    id = "xenon",
    args = ["--max-absolute=C", "--max-modules=B", "--max-average=A", "src/landsat_lst/"],
    pass_filenames = false,
  },
]

# =============================================================================
# Local hooks
# =============================================================================
[[repos]]
repo = "local"
hooks = [
  # Type checking
  {
    id = "ty",
    name = "ty type check",
    entry = "uv run ty check src/",
    language = "system",
    types = ["python"],
    pass_filenames = false,
  },

  # Spell checking
  {
    id = "codespell",
    name = "spell check",
    entry = "uv run codespell src/ tests/ docs/",
    language = "system",
    types = ["python", "markdown"],
    pass_filenames = false,
  },

  # Unit tests on pre-push
  {
    id = "pytest-unit",
    name = "unit tests",
    entry = "uv run pytest tests/unit -x -q --timeout=30",
    language = "system",
    pass_filenames = false,
    stages = ["pre-push"],
  },
]
